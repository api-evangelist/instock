    Unauthorized:
      description: Unauthorized
      headers:
        Instock-Response-ID:
          $ref: '#/components/headers/instockRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthorized
            message: API key is not valid.
  schemas:
    getSingleOrder:
      type: object
      properties:
        org_id:
          type: string
          description: ID of an organization. Globally unique.
        site_id:
          type: string
          description: ID of Instock site. Globally unique.
        order_id:
          $ref: '#/components/schemas/orderId'
        kind:
          type: string
          enum:
          - customer
          - adjustment
          - reception
          - extraction
          default: customer
          description: "Type of an order:\n  * `customer` - order placed by a customer.\n  * `adjustment`- order to correct inventory.\n  * `reception` - order to receive goods from suppliers.\n  * `extraction` - order to extract assets from ASRS.\n"
        placed_at:
          $ref: '#/components/schemas/placedAtTimestamp'
        attributes:
          type: object
          description: Custom attribute(s) added to an order.
          additionalProperties:
            type: string
        lines:
          type: array
          description: List of lines within an order.
          items:
            type: object
            properties:
              line_id:
                $ref: '#/components/schemas/lineId'
              article_id:
                $ref: '#/components/schemas/articleId'
              qty:
                type: integer
                format: int64
                description: Quantity of a specific article in a single order line.
    order:
      type: object
      properties:
        org_id:
          type: string
          description: ID of an organization. Globally unique.
        site_id:
          type: string
          description: ID of Instock site. Globally unique.
        order_id:
          $ref: '#/components/schemas/orderId'
        kind:
          type: string
          enum:
          - customer
          default: customer
          description: "Type of an order:\n * `customer` - order placed by a customer.\n"
        placed_at:
          $ref: '#/components/schemas/placedAtTimestamp'
        attributes:
          type: object
          description: Custom attribute(s) added to an order.
          additionalProperties:
            type: string
        lines:
          type: array
          description: List of lines within an order.
          items:
            type: object
            properties:
              line_id:
                $ref: '#/components/schemas/lineId'
              article_id:
                $ref: '#/components/schemas/articleId'
              qty:
                type: integer
                format: int64
                description: Quantity of a specific article in a single order line.
    toCellId:
      type: string
      description: ID of the target storage cell to which a specific article moved.
      minLength: 1
      maxLength: 1024
      example: VM-TIY6J-P001
    siteId:
      type: string
      description: ID of Instock site. Globally unique.
    placedAtTimestamp:
      type: string
      format: date-time
      description: Time when order was placed [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339).
      example: '2023-01-01T00:00:00Z'
    articleId:
      type: string
      description: ID of an article. Unique in scope of your organization(s).
      pattern: ^[a-zA-Z0-9_+.]+$
    orderId:
      type: string
      description: ID of an order. Unique in scope of your organization(s).
      pattern: ^[a-zA-Z0-9_+.:-]+$
      minLength: 1
      maxLength: 128
    lineId:
      type: string
      description: ID of an order line. Unique in scope of your organization(s).
      pattern: ^[a-zA-Z0-9_+.:-]+$
      minLength: 1
      maxLength: 128
    listSiteOrders:
      type: object
      properties:
        has_more:
          type: boolean
          description: 'If `true`, `next_cursor` to access next part of the list.

            If `false`, response includes the end of the list.

            '
        next_cursor:
          type: string
          description: "Only available when `has_more` is `true`.\nUsed to retrieve the next page of results by \npassing the value as the `start_cursor` parameter \nto the same endpoint.\n"
        org_id:
          type: string
          description: ID of an organization. Globally unique.
        site_id:
          type: string
          description: ID of an Instock site.
        orders:
          type: array
          items:
            type: object
            properties:
              site_id:
                type: string
                description: ID of an Instock site.
              order_id:
                $ref: '#/components/schemas/orderId'
              kind:
                type: string
                enum:
                - customer
                - adjustment
                - reception
                - extraction
                default: customer
                description: "Type of an order:\n * `customer` - order placed by a customer.\n * `adjustment`- order to correct inventory.\n * `reception` - order to receive goods from suppliers.\n * `extraction` - order to extract assets from ASRS.\n"
              placed_at:
                $ref: '#/components/schemas/placedAtTimestamp'
              attributes:
                type: object
                description: Custom attribute(s) added to a specific article.
                additionalProperties:
                  type: string
              lines:
                type: array
                description: List of lines within an order.
                items:
                  type: object
                  properties:
                    line_id:
                      $ref: '#/components/schemas/lineId'
                    article_id:
                      $ref: '#/components/schemas/articleId'
                    qty:
                      type: integer
                      format: int64
    orderStatusRequestTimestamp:
      type: string
      format: date-time
      description: Timestamp of order status request [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339).
      example: '2023-01-01T00:00:00Z'
    orderStatus:
      type: object
      properties:
        org_id:
          type: string
          description: ID of an organization. Globally unique.
        site_id:
          type: string
          description: ID of Instock site. Globally unique.
        order_id:
          $ref: '#/components/schemas/orderId'
        order_status:
          type: string
          enum:
          - registered
          - reserved
          - done
          - canceled
          description: '* `registered` - order registered and awaiting for fulfillment

            * `reserved` - fulfillment in progress

            * `done` - order has been fulfilled

            * `canceled` - order has been canceled

            '
        timestamp:
          $ref: '#/components/schemas/orderStatusRequestTimestamp'
        ordertask_ids:
          type: array
          description: List of ordertasks created for a specific order.
          items:
            type: string
            description: ID of an order task. Unique in scope of your organization(s).
        lines:
          description: List of lines within an order.
          type: array
          items:
            type: object
            properties:
              line_id:
                $ref: '#/components/schemas/lineId'
              article_id:
                $ref: '#/components/schemas/articleId'
              qty:
                type: object
                properties:
                  reserved:
                    type: integer
                    format: int64
                  free:
                    type: integer
                    format: int64
                  requested:
                    type: integer
                    format: int64
                description: "Quantity of articles in a specific state:\n  * `reserved` - quantity of articles that is reserved for fulfillment order that is in progress\n  * `free` - quantity of articles that is available in stock\n  * `requested` - quantity of articles that is requested for an order that is awaiting its fulfillment\n"
    Error:
      type: object
      properties:
        code:
          description: Code that identifies the reason of an error.
          type: string
        message:
          description: Description of an error.
          type: string
  headers:
    instockRequestID:
      description: Auto-generated ID in the response headers to reference a specific request, useful for debugging or seeking support.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      type: http
      scheme: bearer
