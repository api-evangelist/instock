openapi: 3.2.0
info:
  contact:
    name: Instock
    email: info@instock.com
    url: https://instock.com
  license:
    name: Instock
    url: https://instock.com
  title: Instock API reference Orders API
  version: 0.1.0
  description: '# Overview

    This reference is a comprehensive guide to understanding of Instock API and is aimed to

    help developers to integrate their Host system with Instock Cloud (Incloud).'
servers:
- url: https://api.instock.com/v1
security:
- bearerAuth: []
tags:
- name: Orders
  description: Intentions of users of Instock ASRS are represented by `orders` structure.
paths:
  /{site_id}/orders:
    post:
      tags:
      - Orders
      summary: Create customer order
      description: 'Creates a single new customer order within a particular site of your organization.


        **Note**: if `lines` object contains a line with an article that is not uploaded, Incloud will yield `404` and request will fail.'
      operationId: addOrder
      x-codeSamples:
      - lang: cURL
        label: cURL
        source: "curl -X POST 'https://api.instock.com/v1/{site_id}/orders' \\\n-H 'Authorization: Bearer {ACCESS_TOKEN}' \\\n-H 'Content-Type: application/json' \\\n--data-raw '{\n  \"org_id\": \"org_id_001\",\n  \"site_id\": \"site_id_001\",\n  \"order_id\": \"00132455\",\n  \"kind\": \"customer\",\n  \"placed_at\": \"2023-07-17T19:08:00Z\",\n  \"attributes\": {\n    \"wave\": \"3\"\n  },\n  \"lines\": [\n    {\n      \"line_id\": \"00132455-1\",\n      \"article_id\": \"016000124790\",\n      \"qty\": 2\n    }\n  ]\n}'\n"
      parameters:
      - $ref: '#/components/parameters/instockCorrelationID'
      - $ref: '#/components/parameters/siteID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/order'
            examples:
              Order with a single line:
                $ref: '#/components/examples/orderSingleLine'
              Order with multiple lines:
                $ref: '#/components/examples/orderSeveralLines'
      responses:
        '200':
          description: Successful operation.
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                type: string
              examples:
                response:
                  value: Successful operation.
        '400':
          description: Bad request
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Bad request:
                  value:
                    code: bad_request
                    message: Request body/path/query params cannot be validated.
                Order already exists:
                  value:
                    code: resource_cannot_be_created
                    message: order_id already exists.
                Restricted order kind:
                  value:
                    code: resource_cannot_be_created
                    message: Only customer order allowed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Site doesn't exist:
                  value:
                    code: resource_not_found
                    message: site_id doesn't exist.
                Article doesn't exist:
                  value:
                    code: resource_not_found
                    message: article_id doesn't exist.
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
      - Orders
      summary: List all orders
      description: Returns a paginated list of all orders within specific site of an organization.
      operationId: ListSiteOrders
      x-codeSamples:
      - lang: cURL
        label: cURL
        source: 'curl -X GET ''https://api.instock.com/v1/{site_id}/orders?start_cursor={START_CURSOR}&page_size={PAGE_SIZE}'' \

          -H ''Authorization: Bearer {ACCESS_TOKEN}''

          '
      parameters:
      - $ref: '#/components/parameters/instockCorrelationID'
      - $ref: '#/components/parameters/siteID'
      - $ref: '#/components/parameters/startCursor'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Successful operation
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listSiteOrders'
              examples:
                List of orders:
                  $ref: '#/components/examples/listOfSiteOrders'
        '400':
          description: Bad request
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Bad request:
                  value:
                    code: bad_request
                    message: Request body/path/query params cannot be validated.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Site doesn't exist:
                  value:
                    code: resource_not_found
                    message: site_id doesn't exist.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /{site_id}/orders/{order_id}:
    put:
      tags:
      - Orders
      summary: Update customer order
      description: 'Updates a single existing order with kind `customer`.

        Only `registered` orders can be updated.


        **Note**: order update operation is performed via `PUT` method — when updating an order, all parameters must be

        passed.'
      operationId: updateOrder
      x-codeSamples:
      - lang: cURL
        label: cURL
        source: "curl -X PUT 'https://api.instock.com/v1/{site_id}/orders/{order_id}' \\\n-H 'Authorization: Bearer {ACCESS_TOKEN}' \\\n-H 'Content-Type: application/json' \\\n--data-raw '{\n  \"org_id\": \"org_id_001\",\n  \"site_id\": \"site_id_001\",\n  \"order_id\": \"00132455\",\n  \"kind\": \"customer\",\n  \"placed_at\": \"2023-07-17T19:08:00Z\",\n  \"attributes\": {\n    \"wave\": \"3\"\n  },\n  \"lines\": [\n    {\n      \"line_id\": \"00132455-1\",\n      \"article_id\": \"016000124790\",\n      \"qty\": 15\n    }\n  ]\n}'\n"
      parameters:
      - $ref: '#/components/parameters/instockCorrelationID'
      - $ref: '#/components/parameters/siteID'
      - $ref: '#/components/parameters/orderID'
      requestBody:
        description: Update a single order with properties to be changed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/order'
            examples:
              Update customer order with a single line:
                $ref: '#/components/examples/orderSingleLine'
              Update customer order with multiple lines:
                $ref: '#/components/examples/orderSeveralLines'
      responses:
        '200':
          description: Successful operation.
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                type: string
              examples:
                response:
                  value: Successful operation.
        '400':
          description: Bad request
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Bad request:
                  value:
                    code: bad_request
                    message: Request body/path/query params cannot be validated.
                Restricted order kind:
                  value:
                    code: order_cannot_be_updated
                    message: Only customer order can be updated via API.
                Order is not in status "registered":
                  value:
                    code: order_cannot_be_updated
                    message: Customer order is already being fulfilled or fulfilled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Site doesn't exist:
                  value:
                    code: resource_not_found
                    message: site_id doesn't exist.
                Order doesn't exist:
                  value:
                    code: resource_not_found
                    message: order_id doesn't exist.
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
      - Orders
      summary: Retrieve order
      description: Retrieves a single existing order data.
      operationId: getOrder
      x-codeSamples:
      - lang: cURL
        label: cURL
        source: 'curl -X GET ''https://api.instock.com/v1/{site_id}/orders/{order_id}'' \

          -H ''Authorization: Bearer {ACCESS_TOKEN}''

          '
      parameters:
      - $ref: '#/components/parameters/instockCorrelationID'
      - $ref: '#/components/parameters/siteID'
      - $ref: '#/components/parameters/orderID'
      responses:
        '200':
          description: Successful operation.
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getSingleOrder'
              examples:
                Customer order with a single line:
                  $ref: '#/components/examples/orderSingleLine'
                Customer order with multiple lines:
                  $ref: '#/components/examples/orderSeveralLines'
                Reception order:
                  $ref: '#/components/examples/receptionOrder'
        '400':
          description: Bad request
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Bad request:
                  value:
                    code: bad_request
                    message: Request body/path/query params cannot be validated.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Site doesn't exist:
                  value:
                    code: resource_not_found
                    message: site_id doesn't exist.
                Order doesn't exist:
                  value:
                    code: resource_not_found
                    message: order_id doesn't exist.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /{site_id}/orders/{order_id}/status:
    get:
      tags:
      - Orders
      summary: Retrieve order status
      description: Retrieves a single existing order data and its ordertask status.
      operationId: getOrderStatus
      x-codeSamples:
      - lang: cURL
        label: cURL
        source: 'curl -X GET ''https://api.instock.com/v1/{site_id}/orders/{order_id}/status'' \

          -H ''Authorization: Bearer {ACCESS_TOKEN}''

          '
      parameters:
      - $ref: '#/components/parameters/instockCorrelationID'
      - $ref: '#/components/parameters/siteID'
      - $ref: '#/components/parameters/orderID'
      responses:
        '200':
          description: Successful operation
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orderStatus'
              examples:
                Order registered:
                  $ref: '#/components/examples/orderStatusRegistered'
                Order reserved:
                  $ref: '#/components/examples/orderStatusReserved'
                Order done:
                  $ref: '#/components/examples/orderStatusDone'
                Order canceled:
                  $ref: '#/components/examples/orderStatusCancelled'
        '400':
          description: Bad request
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Bad request:
                  value:
                    code: bad_request
                    message: Request body/path/query params cannot be validated.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Site doesn't exist:
                  value:
                    code: resource_not_found
                    message: site_id doesn't exist.
                Order doesn't exist:
                  value:
                    code: resource_not_found
                    message: order_id doesn't exist.
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Orders
      summary: Advance order status
      description: '> **Important**: this a debug endpoint, use it during integration with Incloud or during debugging.


        Advances order status for virtual site from `registered` to `reserved`, from `reserved` to `done`.


        A request body is mandatory for this endpoint. If there''s no need to specify a target storage cell for the order, the body should be an empty JSON object (`{}`).

        However, if you wish to control the storage cell where the order is being moved, you can include the optional parameter `to_cell_id` within the body.


        **Note**: If there is not enough inventory for `article_id` within order then, Incloud will set order status to `canceled`.'
      operationId: advanceOrderStatus
      x-codeSamples:
      - lang: cURL
        label: cURL
        source: 'curl -X POST ''https://api.instock.com/v1/{site_id}/orders/{order_id}/status'' \

          -H ''Content-Type: application/json'' \

          --data-raw ''{"to_cell_id": "VM-TIY6J-P001"}''

          '
      parameters:
      - $ref: '#/components/parameters/instockCorrelationID'
      - $ref: '#/components/parameters/siteID'
      - $ref: '#/components/parameters/orderID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to_cell_id:
                  $ref: '#/components/schemas/toCellId'
      responses:
        '201':
          description: Successful operation.
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                type: string
              examples:
                response:
                  value: ''
        '404':
          description: Not found
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Order doesn't exist:
                  value:
                    code: resource_not_found
                    message: order_id doesn't exist.
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Orders
      summary: Cancel registered order
      description: Cancels a single registered customer order within a particular site of your organization.
      operationId: cancelRegisteredOrder
      x-codeSamples:
      - lang: cURL
        label: cURL
        source: 'curl -X DELETE ''https://api.instock.com/v1/{site_id}/orders/{order_id}/status'' \

          -H ''Authorization: Bearer {ACCESS_TOKEN}''

          '
      parameters:
      - $ref: '#/components/parameters/instockCorrelationID'
      - $ref: '#/components/parameters/siteID'
      - $ref: '#/components/parameters/orderID'
      responses:
        '200':
          description: Successful operation.
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                type: string
              examples:
                response:
                  value: ''
        '400':
          description: Bad request
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Bad request:
                  value:
                    code: bad_request
                    message: Request body/path/query params cannot be validated.
                Order is not in status "registered":
                  value:
                    code: order_cannot_be_updated
                    message: couldn't update order status (current reserved, pending canceled.
        '404':
          description: Not found
          headers:
            Instock-Response-ID:
              $ref: '#/components/headers/instockRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Order doesn't exist:
                  value:
                    code: resource_not_found
                    message: order_id doesn't exist.
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    startCursor:
      name: start_cursor
      in: query
      required: false
      description: "Cursor returned from a previous response, \nused to request the next page of the results. \n"
      schema:
        type: string
        example: fe2cc560-036c-44cd-90e8-294d5a74cebc
        default: ''
    instockCorrelationID:
      name: Instock-Correlation-ID
      description: Optional header ID to track and analyze requests and behaviors across your Host system.
      in: header
      required: false
      schema:
        type: string
    siteID:
      name: site_id
      in: path
      required: true
      description: ID of Instock site. Globally unique.
      schema:
        $ref: '#/components/schemas/siteId'
      example: 1.1.0-1
    pageSize:
      name: page_size
      in: query
      required: false
      description: "The number of articles returned in response. \nDefault (minimum) value is 10, maximum value is 1000.\n"
      schema:
        type: integer
        format: int64
        example: 10
        default: 10
        maximum: 1000
    orderID:
      name: order_id
      in: path
      description: ID of an order. Unique in scope of your organization(s).
      required: true
      schema:
        type: string
      example: '00132455'
  examples:
    orderStatusDone:
      value:
        org_id: org_id_001
        site_id: 1.1.0-1
        order_id: '00132456'
        order_status: done
        timestamp: '2022-03-05T09:30:20Z'
        ordertask_ids:
        - ot0001
        - ot0002
        lines:
        - line_id: 00132456-1
          article_id: '116000487727'
          qty:
            reserved: 10
            free: 10
            requested: 10
        - line_id: 00132456-2
          article_id: '1003000031678'
          qty:
            reserved: 5
            free: 195
            requested: 5
    receptionOrder:
      value:
        org_id: org_id_001
        site_id: 1.1.0-1
        order_id: 8b72a983-c909-4dd6-b5d4-01d1f4b2a669
        kind: reception
        placed_at: '2024-03-27T13:24:47Z'
        attributes:
          org_id_001:asn: ASN-1818AE4RF
        lines:
        - line_id: af7e23f7-08e7-4cf1-b644-1b0cf289e574
          article_id: '99.21004'
          qty: 15
        - line_id: e9ce63cc-dfa3-4edb-adf5-cec750e56bcd
          article_id: '99.91001'
          qty: 100
    orderStatusCancelled:
      value:
        org_id: org_id_001
        site_id: 1.1.0-1
        order_id: '00132457'
        order_status: canceled
        timestamp: '2022-03-05T08:30:25Z'
        ordertask_ids:
        - ot0003
        - ot0004
        lines:
        - line_id: 00132456-1
          article_id: '116000487727'
          qty:
            reserved: 10
            free: 10
            requested: 10
        - line_id: 00132456-2
          article_id: '1003000031678'
          qty:
            reserved: 5
            free: 195
            requested: 5
    orderSingleLine:
      value:
        org_id: org_id_001
        site_id: 1.1.0-1
        order_id: '00132455'
        kind: customer
        placed_at: '2022-03-05T07:38:39Z'
        attributes:
          property1: string
          property2: string
        lines:
        - line_id: 00132455-1
          article_id: '1003000031678'
          qty: 1
    orderStatusRegistered:
      value:
        org_id: org_id_001
        site_id: 1.1.0-1
        order_id: '00132456'
        order_status: registered
        timestamp: '2022-03-05T08:15:21Z'
        ordertask_ids:
