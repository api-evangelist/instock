- aid: instock:instock-orders-api
  name: Instock Orders API
  description: "Intentions of users of Instock ASRS are represented by `orders` structure.\n\nOrders resource\
    \ allows:\n* create/update/retrieve records for picking of goods from the ASRS (`customer` orders)\n\
    * retrieve-only access to records for induction/adjustment/extraction of inventory\n(`adjustment`,\
    \ `reception`, `extraction` orders)\n\nAll operations with orders are performed in scope of a particular\
    \ site and require\n`site_id` as a path parameter.\n\nThe following kinds and statuses of orders are\
    \ in use:\n| Order Kind | Description |\n|--------------|------------------------------------------------------------------------------------------------|\n\
    | `customer`   | order that needs to be fulfilled from ASRS and are placed by you, as client of API.\
    \ |\n| `adjustment` | order to correct current inventory. |   \n| `reception`  | order to receive\
    \ goods or assets into ASRS, triggered by shipment from supplier, return of goods, etc. |\n| `extraction`\
    \ | order to extract assets from ASRS. |\n\n| Order Status | Description |\n|----------------|-----------------------------------------------|\n\
    | `registered`   | order registered and awaiting for fulfillment in scope of ordertask(s).|\n| `reserved`\
    \     | fulfillment in progress.                      |\n| `done`         | order has been fulfilled.\
    \                     | \n| `canceled`    | order has been canceled.                     |    \n \n\
    \n**Note**: \n* only `customer` orders can be updated, and only while they are in status `registered`.\
    \ Once order\nfulfillment has started Instock ASRS freezes (makes read-only) customer orders.\n* custom\
    \ `attributes` object values are optional and defined upon initial integration with Incloud."
  humanURL: https://instock.com/en/docs/api/
  baseURL: https://api.instock.com/v1
  tags:
  - Order
  tags_raw:
  - Orders
  properties:
  - type: OpenAPI
    url: openapi/instock-orders-api-openapi.yml
  - type: Documentation
    url: https://instock.com/en/docs/
  - type: APIReference
    url: https://instock.com/en/docs/api/
  - type: GettingStarted
    url: https://instock.com/en/docs/getting-started/
- aid: instock:instock-ordertasks-api
  name: Instock Ordertasks API
  description: "Fulfillment of orders by associates and ASRS is split into chunks called `ordertasks`.\n\
    An `ordertask` can represent a picking of several lines of customer order, for example.\nEach ordertask\
    \ corresponds to exactly one order and one order can have multiple ordertasks.\nOn the other side,\
    \ each action of robots of ASRS can be attributed back to exactly one ordertask.\n\nIncloud promises,\
    \ once order gets into one of the terminal statuses (`done` or `canceled`) the set\nof corresponding\
    \ ordertasks is immutable, i.e. no new ordertasks to be added, and each ordertask record\nis immutable.\n\
    \nOrdertasks corresponding to customer order are created after order fulfillment is planned, i.e.\
    \ after\norder status changes from `registered` to `reserved`.\nOnce customer order is `done` or `canceled`,\
    \ a client of API can reconstruct full picture of fulfillment of \norder by retrieving ordertasks\
    \ data.\nOrdertasks may be presented by Incloud for all type of orders\n(`customer`, `reception`,\
    \ `adjustment`, `extraction`).\n\n| Ordertask status | Description |\n|----------------|---------------|\n\
    | `reserved`     | ordertask is in progress. |\n| `done`         | ordertask has been completed. |\
    \ \n| `canceled`    | ordertask has been canceled. |"
  humanURL: https://instock.com/en/docs/api/
  baseURL: https://api.instock.com/v1
  tags:
  - Ordertasks
  properties:
  - type: OpenAPI
    url: openapi/instock-ordertasks-api-openapi.yml
  - type: Documentation
    url: https://instock.com/en/docs/
  - type: APIReference
    url: https://instock.com/en/docs/api/
  - type: GettingStarted
    url: https://instock.com/en/docs/getting-started/
- aid: instock:instock-sites-api
  name: Instock Sites API
  description: >-
    Each Instock site (or just site) represents a single instance of Instock ASRS.

    Such instance can represent either physical installation of ASRS or a simulation in sandbox environment.

    Organization may own many sites.

    A single physical site may have many sandboxes and each sandbox will be characterized by its own `site_id`.


    **Note**: `site_id` is required to perform operations with orders, ordertasks, inventory and moves.
  humanURL: https://instock.com/en/docs/api/
  baseURL: https://api.instock.com/v1
  tags:
  - Sites
  properties:
  - type: OpenAPI
    url: openapi/instock-sites-api-openapi.yml
  - type: Documentation
    url: https://instock.com/en/docs/
  - type: APIReference
    url: https://instock.com/en/docs/api/
