aid: instock
name: Instock
description: >-
  Instock is a robotics company delivering a goods-to-person automated storage
  and retrieval system (ASRS) as a fulfillment robotics-as-a-service (RaaS)
  offering. The system pairs a static "Grid" racking framework, stackable
  "Bins", and autonomous three-dimensional "Robots" with "Incloud", a cloud
  software platform that orchestrates warehouse fulfillment operations. Instock
  publishes a REST-based HTTP API (Incloud) that lets a customer's host systems
  (PIM/IMS/OMS) integrate with the ASRS: managing sites, uploading articles
  (SKUs), creating and advancing customer orders, tracking order tasks, and
  reading inventory and article moves. The API accepts and returns JSON, uses
  Bearer-token (JWT) authentication issued during onboarding, cursor-based
  pagination, snake_case properties, and RFC 3339 timestamps. Instock was
  surfaced as a portfolio company of Lux Capital. Sector: robotics / warehouse
  automation.
