    \ across all sites that belong to your organization.\n\n**Note**: \n  * currently articles with `is_serial_numbered:\
    \ true` value cannot be uploaded or updated, Incloud will yield an error.\n  * `attributes` object\
    \ can contain both custom and pre-defined values. Custom attributes defined\n   upon initial integration\
